<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InternBot Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white">

  <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold text-center mb-6">Welcome to InternBot</h2>

    <!-- Input fields -->
    <div class="space-y-3">
      <input id="firstName" type="text" placeholder="First Name" class="input-field hidden">
      <input id="lastName" type="text" placeholder="Last Name" class="input-field hidden">
      <input id="email" type="email" placeholder="Email" class="input-field">
      <input id="password" type="password" placeholder="Password" class="input-field">
    </div>

    <!-- Buttons -->
    <button id="signInBtn" class="btn-primary mt-5">Sign In</button>
    <button id="createAccBtn" class="btn-secondary mt-3">Create Account</button>
    <button id="forgotPassBtn" class="text-sm text-blue-300 mt-2 block mx-auto">Forgot Password?</button>

    <div class="flex items-center justify-center gap-2 my-5">
      <div class="border-t border-white/30 w-1/3"></div>
      <span>OR</span>
      <div class="border-t border-white/30 w-1/3"></div>
    </div>

    <button id="googleLogin" class="flex items-center justify-center gap-2 w-full bg-white text-gray-700 py-2 rounded-lg hover:bg-gray-200 transition">
      <img src="https://developers.google.com/identity/images/g-logo.png" class="w-5 h-5" />
      Continue with Google
    </button>
  </div>

<script type="module">
  import { auth, provider } from "./firebase.js";
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    updateProfile,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

  const firstName = document.getElementById("firstName");
  const lastName = document.getElementById("lastName");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const signInBtn = document.getElementById("signInBtn");
  const createAccBtn = document.getElementById("createAccBtn");
  const forgotPassBtn = document.getElementById("forgotPassBtn");
  const googleLogin = document.getElementById("googleLogin");

  let creatingAccount = false;

  // 🟣 Mode toggle (Create Account / Sign In)
  createAccBtn.addEventListener("click", () => {
    creatingAccount = !creatingAccount;

    if (creatingAccount) {
      firstName.classList.remove("hidden");
      lastName.classList.remove("hidden");
      signInBtn.textContent = "Create Account";
      createAccBtn.textContent = "Already have an account?";
    } else {
      firstName.classList.add("hidden");
      lastName.classList.add("hidden");
      signInBtn.textContent = "Sign In";
      createAccBtn.textContent = "Create Account";
    }
  });

  // 🟢 Main button click (Sign In or Create Account)
  signInBtn.addEventListener("click", async () => {
    try {
      if (creatingAccount) {
        // CREATE NEW ACCOUNT
        if (!email.value || !password.value || !firstName.value || !lastName.value) {
          alert("Please fill all fields!");
          return;
        }

        const userCred = await createUserWithEmailAndPassword(auth, email.value, password.value);
        await updateProfile(userCred.user, {
          displayName: `${firstName.value} ${lastName.value}`,
        });

        alert("🎉 Account created successfully!");
        window.location.href = "index.html";
      } else {
        // SIGN IN EXISTING USER
        await signInWithEmailAndPassword(auth, email.value, password.value);
        alert("✅ Login successful!");
        window.location.href = "index.html";
      }
    } catch (error) {
      alert("⚠️ " + error.message);
    }
  });

  // 🔑 Forgot password
  forgotPassBtn.addEventListener("click", async () => {
    if (!email.value) {
      alert("Please enter your email to reset password.");
      return;
    }
    try {
      await sendPasswordResetEmail(auth, email.value);
      alert("📩 Password reset link sent to your email!");
    } catch (error) {
      alert("⚠️ " + error.message);
    }
  });

  // 🌐 Google Sign-In
  googleLogin.addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, provider);
      alert("✅ Google login successful!");
      window.location.href = "index.html";
    } catch (error) {
      alert("⚠️ Google Login Error: " + error.message);
    }
  });
</script>

  <style>
    .input-field {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      color: white;
      background-color: rgba(255, 255, 255, 0.2);
    }
    .btn-primary {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background-color: #2563eb;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-primary:hover { background-color: #1e40af; }
    .btn-secondary {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background-color: #22c55e;
      color: white;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn-secondary:hover { background-color: #16a34a; }
  </style>

</body>
</html>
